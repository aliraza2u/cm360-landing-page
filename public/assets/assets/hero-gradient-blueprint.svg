<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" fill="none">
<defs>
  <linearGradient id="hero" x1="120" y1="60" x2="1480" y2="850" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B3C9D"/>
    <stop offset="0.36" stop-color="#1267E9"/>
    <stop offset="0.72" stop-color="#168EF7"/>
    <stop offset="1" stop-color="#22C7E8"/>
  </linearGradient>
  <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1260 180) rotate(135) scale(460 340)">
    <stop stop-color="#7EEBFF" stop-opacity=".38"/>
    <stop offset="1" stop-color="#7EEBFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 780) rotate(-36) scale(560 340)">
    <stop stop-color="#5B5CFF" stop-opacity=".26"/>
    <stop offset="1" stop-color="#5B5CFF" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
    <path d="M64 0H0V64" stroke="#D8F4FF" stroke-opacity=".09" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="44"/>
  </filter>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#fff" stop-opacity=".65"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
  </linearGradient>
</defs>

<rect width="1600" height="920" rx="48" fill="url(#hero)"/>
<rect width="1600" height="920" rx="48" fill="url(#grid)"/>
<rect width="1600" height="920" rx="48" fill="url(#glow1)"/>
<rect width="1600" height="920" rx="48" fill="url(#glow2)"/>

<!-- soft light -->
<ellipse cx="1350" cy="120" rx="260" ry="160" fill="#B8F6FF" fill-opacity=".13" filter="url(#blur)"/>

