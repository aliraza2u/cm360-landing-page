<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<defs>
  <pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
  </pattern>
  <pattern id="grid" width="200" height="200" patternUnits="userSpaceOnUse">
    <rect width="200" height="200" fill="url(#smallGrid)"/>
    <path d="M200 0H0V200" fill="none" stroke="#BEEBFF" stroke-opacity="0.075" stroke-width="1.2"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="white" stop-opacity="0"/>
    <stop offset="0.42" stop-color="white" stop-opacity="0.55"/>
    <stop offset="1" stop-color="white" stop-opacity="0.95"/>
  </linearGradient>
  <mask id="mask"><rect width="1200" height="800" fill="url(#fade)"/></mask>
</defs>
<rect width="1200" height="800" fill="url(#grid)" mask="url(#mask)"/>
</svg>